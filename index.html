<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020510">
  <title>You Were Once My Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ NIGHT SKY ============ -->
  <div class="sky" aria-hidden="true">
    <div class="horizon-glow"></div>
    <div class="moon-glow"></div>
    <div class="moon"></div>
    <div id="stars"></div>
    <div id="shooting"></div>
    <div id="particles"></div>
    <div class="vignette"></div>
  </div>

  <!-- ============ MUSIC PLAYER (always available) ============ -->
  <header class="player" id="player" role="region" aria-label="Music player">
    <div class="player-row">
      <button type="button" id="playBtn" class="play-btn" aria-label="Play">
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a.6.6 0 0 0 .92.5l10.6-6.8a.6.6 0 0 0 0-1L8.92 4.7a.6.6 0 0 0-.92.5z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
      </button>
      <div class="meta">
        <span id="songTitle" class="song-title"></span>
        <span id="songArtist" class="song-artist"></span>
      </div>
      <button type="button" id="lyricsBtn" class="lyrics-btn" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
        <span>Lyrics</span>
      </button>
    </div>
    <div class="player-row seek-row">
      <span id="tCur" class="time">0:00</span>
      <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek through the song">
      <span id="tDur" class="time">0:00</span>
    </div>
    <p id="audioHint" class="audio-hint" role="status" aria-live="polite" hidden></p>
  </header>

  <!-- ============ STAGE: password + envelope ============ -->
  <main class="stage" id="stage">

    <section class="lock" id="lock" aria-labelledby="whisper">
      <p class="whisper" id="whisper">Something is waiting&hellip;</p>
      <form class="lock-form" id="lockForm" autocomplete="off" novalidate>
        <label class="sr-only" for="pw">Password</label>
        <input id="pw" name="pw" type="password" inputmode="numeric" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="Enter password" maxlength="32">
        <button type="submit" class="unlock-btn">Unlock</button>
      </form>
      <p class="pw-error" id="pwError" role="alert" aria-live="assertive"></p>
    </section>

    <section class="env-wrap" id="envWrap" hidden aria-label="A letter">
      <div class="env-glow" aria-hidden="true"></div>
      <div class="env-shadow" aria-hidden="true"></div>

      <div class="env-float" id="envFloat">
        <div class="env-hover" id="envHover">
          <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the envelope">

            <!-- inside of the envelope -->
            <svg class="env-part env-back" viewBox="0 0 360 245" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#9c8b68"/><stop offset="1" stop-color="#b8a883"/>
                </linearGradient>
              </defs>
              <g><rect width="360" height="245" rx="4" fill="url(#gBack)"/></g>
            </svg>

            <!-- the letter (message) -->
            <div class="letter" id="letter">
              <div class="letter-scroll" id="letterScroll">
                <div class="letter-inner" id="letterInner"></div>
              </div>
            </div>

            <!-- front pocket -->
            <svg class="env-part env-front" viewBox="0 0 360 245" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9cdb0"/><stop offset="1" stop-color="#e6dbc1"/></linearGradient>
                <linearGradient id="gR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#d4c7a9"/><stop offset="1" stop-color="#e3d8bd"/></linearGradient>
                <linearGradient id="gB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e9dfc6"/><stop offset="1" stop-color="#efe6cf"/></linearGradient>
              </defs>
              <g>
                <polygon points="0,0 180,128 0,245" fill="url(#gL)" stroke="url(#gL)" stroke-width=".6"/>
                <polygon points="360,0 180,128 360,245" fill="url(#gR)" stroke="url(#gR)" stroke-width=".6"/>
                <polygon points="0,245 180,128 360,245" fill="url(#gB)" stroke="url(#gB)" stroke-width=".6"/>
              </g>
              <g fill="none" stroke="rgba(80,60,30,.22)" stroke-width="1" stroke-linejoin="round">
                <polyline points="0,0 180,128 360,0"/>
                <polyline points="0,245 180,128 360,245"/>
              </g>
              <rect x=".5" y=".5" width="359" height="244" rx="4" fill="none" stroke="rgba(70,50,25,.25)"/>
            </svg>

            <!-- flap (rotates open) -->
            <div class="flap" id="flap">
              <div class="flap-face flap-out">
                <svg viewBox="0 0 360 175" preserveAspectRatio="none" aria-hidden="true">
                  <defs>
                    <linearGradient id="gFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e8d1"/><stop offset="1" stop-color="#e2d6ba"/></linearGradient>
                    <radialGradient id="gSeal" cx=".38" cy=".32" r=".8">
                      <stop offset="0" stop-color="#a23a4c"/><stop offset=".55" stop-color="#7a2336"/><stop offset="1" stop-color="#4a1222"/>
                    </radialGradient>
                  </defs>
                  <g><polygon points="0,0 360,0 180,150" fill="url(#gFlap)"/></g>
                  <polyline points="0,0 180,150 360,0" fill="none" stroke="rgba(80,60,30,.28)" stroke-width="1.2" stroke-linejoin="round"/>
                  <circle cx="180" cy="141" r="23" fill="rgba(0,0,0,.28)" transform="translate(1.5 3)"/>
                  <circle cx="180" cy="141" r="22" fill="url(#gSeal)"/>
                  <circle cx="180" cy="141" r="15.5" fill="none" stroke="rgba(255,210,215,.22)" stroke-width="1.2"/>
                  <path d="M180 149.5c-6-4.4-9.4-7.2-9.4-11 0-2.6 2-4.5 4.4-4.5 1.9 0 3.9 1 5 2.8 1.1-1.8 3.1-2.8 5-2.8 2.4 0 4.4 1.9 4.4 4.5 0 3.8-3.4 6.6-9.4 11z" fill="rgba(255,205,212,.34)"/>
                </svg>
              </div>
              <div class="flap-face flap-in">
                <svg viewBox="0 0 360 175" preserveAspectRatio="none" aria-hidden="true">
                  <defs><linearGradient id="gFlapIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a880"/><stop offset="1" stop-color="#a39370"/></linearGradient></defs>
                  <!-- drawn upside-down on purpose: the face is flipped when the flap opens -->
                  <g><polygon points="0,175 360,175 180,25" fill="url(#gFlapIn)"/></g>
                  <polyline points="0,175 180,25 360,175" fill="none" stroke="rgba(60,45,20,.3)" stroke-width="1.2" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>

      <p class="env-hint" id="envHint" aria-hidden="true">Tap the envelope</p>
    </section>
  </main>

  <!-- ============ MOVING GRASS ============ -->
  <div class="grass" id="grass" aria-hidden="true">
    <div class="layer" id="gBackL"></div>
    <div class="layer" id="gMidL"></div>
    <div class="layer" id="gFrontL"></div>
  </div>

  <div id="burst" aria-hidden="true"></div>

  <!-- ============ LYRICS PANEL ============ -->
  <div class="lyrics-panel" id="lyricsPanel" role="dialog" aria-modal="true" aria-label="Lyrics" hidden>
    <button type="button" class="lyrics-close" id="lyricsClose" aria-label="Close lyrics">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="lyrics-scroll" id="lyricsScroll">
      <div class="lyrics-list" id="lyricsList"></div>
    </div>
  </div>

  <!-- ============ OPTIONAL: lyric sync helper (open index.html#sync) ============ -->
  <aside class="sync-tool" id="syncTool" hidden aria-label="Lyric sync helper">
    <p class="sync-title">Lyric sync helper</p>
    <p class="sync-help">Play the song. Press <kbd>Space</kbd> (or tap the big button) at the exact moment each line starts being sung.</p>
    <p class="sync-next" id="syncNext"></p>
    <div class="sync-actions">
      <button type="button" id="syncTap" class="sync-tap">Tap: line starts now</button>
      <button type="button" id="syncUndo">Undo</button>
      <button type="button" id="syncReset">Restart</button>
    </div>
    <textarea id="syncOut" rows="5" readonly aria-label="Generated timestamps"></textarea>
    <button type="button" id="syncCopy">Copy timestamps</button>
  </aside>

  <audio id="audio" preload="auto"></audio>

  <noscript><p style="position:fixed;inset:auto 0 40% 0;text-align:center;color:#9fb2d6;font-family:Georgia,serif">This little letter needs JavaScript to open.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
